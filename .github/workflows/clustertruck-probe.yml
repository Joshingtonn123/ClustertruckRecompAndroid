name: Clustertruck port tooling checks

on:
  push:
    branches:
      - clustertruck-dev
  pull_request:
    branches:
      - clustertruck-dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the NSO parser dependency
        run: python -m pip install capstone==5.0.3 unicorn==2.1.2 -r tools/requirements-probe.txt
      - name: Compile the diagnostic
        run: python -m py_compile tools/clustertruck_probe.py tools/nso.py
      - name: Run diagnostic unit tests
        run: python -m unittest discover -s tests -v

  generic-recomp-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NSO recompiler dependencies
        run: python -m pip install capstone==5.0.3 unicorn==2.1.2 -r tools/requirements-probe.txt
      - name: Check recompiler syntax
        run: python -m py_compile tools/gen.py tools/lifter.py tools/analyze.py tools/nso.py
      - name: Smoke-test generic NSO recompilation
        run: python -m unittest discover -s tests -p "test_generic_recomp.py" -v


  android-dump-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Test and build the Android 11-compatible dump probe
        run: bash ./android/probe/gradlew -p android/clustertruck-probe --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload dump probe APK
        uses: actions/upload-artifact@v4
        with:
          name: clustertruck-dump-probe-debug
          path: android/clustertruck-probe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
