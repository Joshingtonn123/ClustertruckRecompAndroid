name: Clustertruck port tooling checks

on:
  push:
    branches:
      - clustertruck-dev
  pull_request:
    branches:
      - clustertruck-dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the NSO parser dependency
        run: python -m pip install -r tools/requirements-probe.txt
      - name: Compile the diagnostic
        run: python -m py_compile tools/clustertruck_probe.py tools/nso.py
      - name: Run diagnostic unit tests
        run: python -m unittest discover -s tests -v
